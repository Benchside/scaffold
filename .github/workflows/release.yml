name: Release

# Only ever opens/updates the "Version Packages" PR — never publishes.
# Safe to run unattended on every push to main since it never touches
# npm. See publish.yml for the actual publish step, gated behind a
# required-reviewer approval on the npm-publish environment.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Open or update the Version Packages PR
    runs-on: ubuntu-latest
    # changesets/action commits its version-bump changes internally
    # (e.g. "Version Packages (beta)") — a message with no
    # type(scope): subject prefix, which our own commitlint hook (via
    # lefthook, installed by `pnpm install`'s prepare script) would
    # otherwise reject. LEFTHOOK=0 exempts this job's git operations
    # from local hooks; ci.yml already re-validates everything this
    # commit touches on its own next run, so nothing is actually skipped.
    env:
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm" # caches the pnpm store, keyed on pnpm-lock.yaml — speeds up `pnpm install` on unchanged lockfiles

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for pending changesets
        id: check-changesets
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

      - name: Version packages
        if: steps.check-changesets.outputs.pending != '0'
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          github-token: ${{ secrets.GITHUB_TOKEN }}
