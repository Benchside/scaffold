name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Install, build, typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm" # caches the pnpm store, keyed on pnpm-lock.yaml — speeds up `pnpm install` on unchanged lockfiles

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test repo tooling scripts
        run: pnpm test:scripts

      - name: Validate tokens
        run: pnpm tokens:validate

      - name: Generate token docs
        run: pnpm tokens:docs

      - name: Test
        run: pnpm test

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Browser test
        run: pnpm test:browser

      # Playwright visual regression baselines are OS-suffixed
      # (*-linux.png) and only ever generated by this job, never
      # committed from a dev machine — see CONTRIBUTING.md. On failure
      # (new component with no baseline yet, or a real regression),
      # this uploads each test's actual/diff/expected images so the
      # correct one can be downloaded and committed as the new baseline
      # without needing Docker locally.
      - name: Upload visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-results
          path: |
            **/test-results/
            **/playwright-report/
          retention-days: 14
